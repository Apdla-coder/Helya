<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حبيبة هاند ميد | Habiba Handmade</title><meta name="theme-color" content="#b8577a">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<main class="wrap"><div class="crumb" id="cr"></div><div id="pd"></div><h2 class="st" id="rt"></h2><div class="hz" id="rl"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="common.js"></script>
<script>
let n=1;
function page(){const id=new URLSearchParams(location.search).get('id'),p=P.find(x=>x.id==id);
 if(!p){$('pd').innerHTML=`<p style="padding:60px 0;text-align:center">${t('nf')}</p>`;return}
 const im=[p.image_url,...(p.images||[])].filter((v,i,a)=>v&&a.indexOf(v)==i),o=off(p),sp=X(p)['specs_'+lang]||X(p).specs_ar||[];
 document.title=nm(p)+' | '+brand();$('cr').innerHTML=`<a href="index.html">${t('home')}</a> / ${esc(ct(p.category))}`;
 const rows=[[t('cat'),ct(p.category)],...sp,[t('av'),p.stock>0?t('inst'):t('out')]];
 $('pd').innerHTML=`<div class="pg"><div><img class="big" id="big" src="${esc(im[0]||'')}" alt="${esc(nm(p))}"><div class="th">${im.map((u,i)=>`<img class="${i?'':'on'}" src="${esc(u)}" onclick="big.src=this.src;document.querySelectorAll('.th img').forEach(x=>x.classList.toggle('on',x==this))">`).join('')}</div></div>
 <div class="i">${X(p).weekly?`<span class="bd" style="position:static;width:max-content">${t('wk')}</span>`:''}<h1>${esc(nm(p))}</h1><div class="price"><b style="font-size:26px">${p.price} ${cur()}</b>${o?`<s>${p.old_price}</s> <span class="bd" style="position:static">-${o}%</span>`:''}</div>
 <p style="color:var(--mut);line-height:1.9">${esc(ds(p))}</p><table class="sp"><caption style="text-align:start;font-weight:800;padding:6px 0">${t('sp')}</caption>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
 ${p.stock>0?`<div class="q"><span>${t('qty')}</span><button class="chip" onclick="q(-1)">−</button><b id="qn">1</b><button class="chip" onclick="q(1)">+</button></div><button class="btn" onclick="add('${p.id}',n)">${t('add')}</button>`:`<button class="btn" disabled>${t('out')}</button>`}
 <button class="chip" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):navigator.clipboard.writeText(location.href)">${t('share')}</button></div></div>`;
 window.q=d=>{n=Math.max(1,Math.min(p.stock,n+d));$('qn').textContent=n};
 const r=P.filter(x=>x.category==p.category&&x.id!=p.id).slice(0,6);$('rt').textContent=r.length?t('rel'):'';$('rl').innerHTML=r.map(card).join('');
 const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:nm(p),image:im,description:ds(p),offers:{'@type':'Offer',price:p.price,priceCurrency:'EGP',availability:p.stock>0?'https://schema.org/InStock':'https://schema.org/OutOfStock'}});document.head.appendChild(s)}
</script></body></html>
